<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knit Sale</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f6fa;color:#292538;font:15px/1.6 system-ui,sans-serif}main{max-width:860px;margin:auto;padding:32px 20px}h1{font-size:32px;letter-spacing:-1px;margin:0}p{color:#706a80}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.stat,article{background:white;border:1px solid #e7e3ed;border-radius:16px;padding:18px}.stat strong{display:block;font-size:28px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{border:1px solid #ddd5e8;background:white;color:inherit;border-radius:20px;padding:9px 16px;cursor:pointer}button[aria-pressed=true]{background:#51406f;color:white}article{margin-bottom:10px}header{display:flex;justify-content:space-between;gap:12px}h2{font-size:17px;margin:0}.badge{font-size:13px;color:#756e80}.sale{color:#24734e}a{color:#51406f}small{color:#777}article p{margin:8px 0}@media(max-width:420px){.stat{padding:12px}.stat strong{font-size:24px}}</style><main><h1>KNIT SALE</h1><p>뜨개 쇼핑몰 할인 현황</p><small id="updated" role="status">데이터 불러오는 중</small><div class="stats" id="stats"></div><nav aria-label="상태 필터"><button data-filter="all" aria-pressed="true">전체</button><button data-filter="sale" aria-pressed="false">할인 중</button><button data-filter="unknown" aria-pressed="false">확인 필요</button><button id="refresh">새로고침</button></nav><section id="list"></section><p><small>미확인은 할인 없음과 다릅니다. 구매 전 판매처의 실제 행사 조건을 확인하세요. 새로고침은 저장된 데이터를 다시 읽습니다.</small></p></main><script>let data,filter='all';const el=(tag,t,cls)=>{let n=document.createElement(tag);n.textContent=t;if(cls)n.className=cls;return n};function active(s){return s.status==='sale'&&s.end&&Date.now()<=Date.parse(s.end)}function render(){if(!data)return;const shops=data.shops;const count=shops.filter(active).length;document.querySelector('#stats').replaceChildren(...[['전체 쇼핑몰',shops.length],['할인 중',count],['확인 필요',shops.length-count]].map(([k,v])=>{let n=el('div',k,'stat');n.append(el('strong',v));return n}));document.querySelector('#list').replaceChildren(...shops.filter(s=>filter==='all'||(filter==='sale'?active(s):!active(s))).sort((a,b)=>Number(active(b))-Number(active(a))).map(s=>{let n=el('article',''),h=el('header','');h.append(el('h2',s.name),el('span',active(s)?'할인 중':'미확인','badge '+(active(s)?'sale':'')));n.append(h,el('p',s.status==='sale'&&!active(s)?'이전 행사 종료 · 최신 정보 확인 필요':s.description));if(s.url&&/^https:\/\//.test(s.url)){let a=el('a','판매처 확인 ↗');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';n.append(a)}return n}));}async function load(){try{const r=await fetch('sales.json',{cache:'no-store'});if(!r.ok)throw Error();data=await r.json();document.querySelector('#updated').textContent='데이터 기준: '+data.updated+' · '+data.source;render()}catch(e){document.querySelector('#updated').textContent='데이터를 불러오지 못했습니다.'}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});document.querySelector('#refresh').onclick=load;load();</script></html>
