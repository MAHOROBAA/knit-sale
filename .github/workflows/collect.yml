name: Collect shop promotions
on:
  schedule:
    - cron: '5 23 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-sales
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect promotions
        env:
          BACKUP_RUN: ${{ github.event.schedule == '30 23 * * *' && '1' || '0' }}
        run: python scripts/collect.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sales.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh shop promotion candidates"
            git push
          fi
